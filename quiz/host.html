<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/src/site-init.js"></script>
  <title>Quiz hosten</title>
  <link rel="icon" href="/src/img/favicon.svg">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a0e4a">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/quiz.css">
</head>
<body class="quiz-body">
  <div class="quiz-app-shell">
    <div class="quiz-topbar">
      <a href="/quiz/library.html" class="quiz-back-link" aria-label="Zurück">←</a>
      <span class="quiz-topbar-title" id="host-quiz-title"></span>
      <span class="quiz-topbar-code d-none" id="host-topbar-code"></span>
      <button type="button" class="quiz-topbar-end-btn d-none" id="btn-end-quiz">Quiz beenden</button>
    </div>

    <section class="quiz-host-stage">
      <div id="host-lobby" class="d-none quiz-host-lobby-grid">
        <div>
          <p>Code zum Beitreten:</p>
          <div class="quiz-host-code" id="host-code"></div>
          <div class="quiz-toolbar mt-3">
            <button type="button" class="quiz-btn quiz-btn-primary" id="btn-start-quiz">Quiz starten</button>
          </div>
        </div>
        <div>
          <div class="quiz-host-qr-wrap"><canvas id="host-qr"></canvas></div>
        </div>
      </div>
      <div id="host-players-wrap" class="d-none">
        <p id="host-player-count" class="quiz-host-progress"></p>
        <div class="quiz-host-players" id="host-players"></div>
      </div>

      <div id="host-question" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <div class="quiz-timer-badge d-none" id="host-timer">--</div>
        <p class="quiz-question-text" id="host-question-text"></p>
        <img id="host-question-image" class="quiz-question-image d-none">
        <p class="quiz-waiting-banner d-none" id="host-intro-caption">Antworten erscheinen gleich …</p>
        <div class="quiz-answer-grid d-none" id="host-answer-grid" style="max-width:640px;"></div>
        <p class="quiz-host-progress" id="host-answer-count"></p>
        <div class="quiz-toolbar d-none" id="host-reveal-toolbar">
          <button type="button" class="quiz-btn quiz-btn-primary" id="btn-reveal">Antworten anzeigen</button>
        </div>
      </div>

      <div id="host-reveal" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <p class="quiz-question-text" id="host-reveal-text"></p>
        <div class="quiz-host-bars" id="host-bars"></div>
        <div class="quiz-toolbar">
          <button type="button" class="quiz-btn quiz-btn-primary" id="btn-to-leaderboard">Weiter zur Rangliste</button>
        </div>
      </div>

      <div id="host-leaderboard" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <h1>Rangliste</h1>
        <div class="quiz-leaderboard" id="host-leaderboard-list"></div>
        <div class="quiz-toolbar">
          <button type="button" class="quiz-btn quiz-btn-primary" id="btn-next-question">Nächste Frage</button>
        </div>
      </div>

      <div id="host-ended" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
        <h1>Quiz beendet 🎉</h1>
        <div class="quiz-leaderboard" id="host-final-leaderboard-list"></div>
        <div class="quiz-toolbar">
          <button type="button" class="quiz-btn quiz-btn-primary" id="btn-restart-quiz" style="max-width:280px;">Neu starten (frische Runde)</button>
          <a class="quiz-btn quiz-btn-secondary-outline" href="/quiz/library.html" style="max-width:280px;">Zurück zu meinen Quizzes</a>
        </div>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/auth-ui.js"></script>
  <script src="/src/quiz-client.js"></script>
  <script src="/src/quiz-host.js"></script>
</body>
</html>
