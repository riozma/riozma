<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/src/site-init.js"></script>
  <title>Meine Quizzes</title>
  <link rel="icon" href="/src/img/favicon.svg">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/quiz.css">
  <style>
    body.site-body.quiz-light-body {
      background: linear-gradient(180deg, var(--color-bg) 0%, var(--color-bg-soft) 100%);
    }
  </style>
</head>
<body class="site-body quiz-light-body">
  <header class="quiz-light-topbar">
    <div class="quiz-light-topbar-inner">
      <a href="/quiz/" class="trouvo-brand-link"><span class="quiz-wordmark-sm">Quiz</span></a>
    </div>
  </header>

  <main class="trouvo-main">
    <section id="login-section" class="trouvo-login-section">
      <div class="trouvo-login-wrap">
        <h1 class="section-heading">Meine Quizzes</h1>
        <p class="section-description">Melde dich an, um deine Quizzes zu verwalten.</p>
        <div id="auth-container"></div>
      </div>
    </section>

    <section id="dashboard-section" class="d-none">
      <div class="trouvo-dashboard-header">
        <div>
          <h1 class="section-heading">Meine Quizzes</h1>
        </div>
        <div class="trouvo-header-actions">
          <div id="auth-container-dashboard"></div>
          <button type="button" class="btn btn-primary" id="btn-new-quiz">+ Neues Quiz</button>
        </div>
      </div>
      <p id="library-message" class="admin-message"></p>
      <div id="quiz-library-grid" class="quiz-library-grid"></div>
    </section>
  </main>

  <footer class="site-footer"><p>© Manuel Rio Zeltner</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/ui-feedback.js"></script>
  <script src="/src/auth-ui.js"></script>
  <script src="/src/quiz-client.js"></script>
  <script src="/src/quiz-library.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
