<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/src/site-init.js"></script>
  <title>Quiz beitreten</title>
  <link rel="icon" href="/src/img/favicon.svg">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a0e4a">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/quiz.css">
</head>
<body class="quiz-body">
  <div class="quiz-app-shell">
    <div class="quiz-topbar">
      <a href="/quiz/" class="quiz-back-link" aria-label="Zurück">←</a>
    </div>

    <main class="quiz-main">
      <section id="step-code" class="quiz-card">
        <h1>Quiz beitreten</h1>
        <div class="quiz-form-group">
          <label for="input-code">Spiel-Code</label>
          <input type="text" id="input-code" class="quiz-input quiz-code-input" maxlength="6" inputmode="numeric" placeholder="123456">
        </div>
        <p id="code-error" class="quiz-error"></p>
        <button type="button" class="quiz-btn quiz-btn-primary" id="btn-code-next">Weiter</button>
      </section>

      <section id="step-name" class="quiz-card d-none">
        <h1>Wie heisst du?</h1>
        <div class="quiz-form-group">
          <label for="input-name">Dein Name</label>
          <input type="text" id="input-name" class="quiz-input" maxlength="24" placeholder="Name">
        </div>
        <p id="name-error" class="quiz-error"></p>
        <button type="button" class="quiz-btn quiz-btn-primary" id="btn-name-join">Beitreten</button>
      </section>

      <section id="step-game" class="quiz-main d-none" style="padding:0;">
        <div id="game-lobby" class="d-none">
          <p class="quiz-waiting-banner">Bitte warten – das Quiz startet bald</p>
        </div>

        <div id="game-intro" class="d-none quiz-intro-stage">
          <p class="quiz-question-text" id="intro-question-text"></p>
          <img id="intro-question-image" class="quiz-question-image d-none">
          <div class="quiz-intro-ring-wrap" id="intro-ring"></div>
          <p class="quiz-waiting-banner" id="intro-caption">Antworten erscheinen gleich …</p>
        </div>

        <div id="game-collect" class="d-none quiz-intro-stage">
          <p class="quiz-question-text" id="collect-question-text"></p>
          <img id="collect-question-image" class="quiz-question-image d-none">
          <div id="collect-form" class="quiz-form-group" style="width:100%;max-width:420px;">
            <textarea id="collect-input" class="quiz-input" rows="3" maxlength="280" placeholder="Deine Antwort …"></textarea>
            <p id="collect-error" class="quiz-error"></p>
            <button type="button" class="quiz-btn quiz-btn-primary" id="btn-collect-submit">Absenden</button>
          </div>
          <p id="collect-submitted-banner" class="quiz-waiting-banner d-none">Eingereicht – bitte warten</p>
        </div>

        <div id="game-question" class="d-none quiz-fullscreen-question">
          <div class="quiz-timer-badge quiz-timer-badge-float" id="question-timer">--</div>
          <div class="quiz-answer-grid quiz-answer-grid-fullscreen" id="answer-grid"></div>
          <div class="quiz-choice-list d-none" id="answer-list"></div>
        </div>

        <div id="game-answered" class="d-none">
          <p class="quiz-waiting-banner">Antwort gesendet – bitte warten</p>
        </div>

        <div id="game-reveal" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
          <p class="quiz-feedback" id="reveal-feedback"></p>
        </div>

        <div id="game-leaderboard" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
          <p class="quiz-waiting-banner">Bitte warten</p>
          <div class="quiz-leaderboard" id="leaderboard-list"></div>
        </div>

        <div id="game-ended" class="d-none" style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
          <h1>Quiz beendet 🎉</h1>
          <div class="quiz-leaderboard" id="final-leaderboard-list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/quiz-client.js"></script>
  <script src="/src/quiz-join.js"></script>
</body>
</html>
