<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/src/site-init.js"></script>
  <title>Quiz</title>
  <link rel="icon" href="/src/img/favicon.svg">
  <meta name="description" content="Quiz – Live-Quiz erstellen und mit anderen spielen.">
  <meta name="theme-color" content="#2a0e4a">
  <link rel="canonical" href="https://riozma.ch/quiz/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/quiz.css">
</head>
<body class="quiz-body">
  <div class="quiz-app-shell">
    <div class="quiz-topbar">
      <a href="/" class="quiz-back-link" aria-label="Zur Startseite">←</a>
    </div>
    <main class="quiz-main">
      <div class="quiz-wordmark">Q<span class="quiz-wordmark-accent">uiz</span></div>

      <div class="quiz-hub">
        <a href="/quiz/join.html" class="quiz-hub-btn quiz-hub-btn-primary">Quiz beitreten</a>
      </div>

      <div class="quiz-hub-divider">für Ersteller</div>

      <div id="quiz-auth-container"></div>

      <div id="quiz-owner-actions" class="quiz-hub d-none">
        <a href="/quiz/library.html" class="quiz-hub-btn quiz-hub-btn-secondary">Quiz laden</a>
        <button type="button" class="quiz-hub-btn quiz-hub-btn-secondary" id="quiz-btn-create">Neues Quiz erstellen</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/ui-feedback.js"></script>
  <script src="/src/auth-ui.js"></script>
  <script src="/src/quiz-client.js"></script>
  <script src="/src/quiz-landing.js"></script>
</body>
</html>
