<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/src/site-init.js"></script>
  <title>Plan – Reisen</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="site-body">
  <header class="site-header" data-site-header data-header-context="reisen"></header>

  <main class="trouvo-main">
    <p id="plan-loading">Lade Reiseplan…</p>
    <div id="plan-content" class="d-none">
      <div class="trouvo-edit-header">
        <div>
          <p class="eyebrow">Plan</p>
          <h1 id="plan-trip-title" class="section-heading"></h1>
          <p id="plan-trip-meta" class="text-muted small mb-0"></p>
        </div>
      </div>

      <p id="planning-save-status" class="edit-save-status-bar" aria-live="polite"></p>

      <section class="planning-section" id="trip-details-section">
        <div class="planning-section-head"><h2 class="planning-section-title">Reise-Details</h2></div>
        <div class="reisen-trip-details-grid">
          <div class="mb-2">
            <label class="form-label" for="trip-field-name">Name</label>
            <input type="text" class="form-control" id="trip-field-name">
          </div>
          <div class="mb-2">
            <label class="form-label" for="trip-field-komoot">Gesamtroute-Link (Komoot o.ä.)</label>
            <input type="text" class="form-control" id="trip-field-komoot" placeholder="https://…">
          </div>
          <div class="mb-2 reisen-trip-details-full">
            <label class="form-label" for="trip-field-description">Beschreibung</label>
            <textarea class="form-control" id="trip-field-description" rows="2"></textarea>
          </div>
        </div>
      </section>

      <section class="planning-section" id="useful-links-section">
        <div class="planning-section-head"><h2 class="planning-section-title">Nützliche Links</h2></div>
        <div id="useful-links-list"></div>
        <div class="builder-add-row">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-add-link">+ Link</button>
        </div>
      </section>

      <section class="planning-section" id="days-section">
        <div class="planning-section-head"><h2 class="planning-section-title">Tag für Tag</h2></div>
        <div id="days-list"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/ui-feedback.js"></script>
  <script src="/src/auto-save-status.js"></script>
  <script src="/src/image-upload.js"></script>
  <script src="/src/reisen-client.js"></script>
  <script src="/src/reisen-plan.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/src/site-header.js"></script>
  <script src="/src/site-nav.js"></script>
</body>
</html>
