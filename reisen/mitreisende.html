<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/src/site-init.js"></script>
  <title>Mitreisende – Reisen</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="site-body">
  <header class="site-header" data-site-header data-header-context="reisen"></header>

  <main class="trouvo-main">
    <p id="members-loading">Lade Mitreisende…</p>
    <div id="members-content" class="d-none">
      <div class="trouvo-edit-header">
        <div>
          <p class="eyebrow">Mitreisende</p>
          <p class="text-muted small mb-0">Alle Mitreisenden haben vollen Zugriff auf die Reise. Nur der Ersteller kann die Reise löschen.</p>
        </div>
      </div>

      <p id="members-message" class="admin-message"></p>

      <section class="planning-section">
        <div class="planning-section-head"><h2 class="planning-section-title">Mitreisende</h2></div>
        <div id="members-list"></div>
        <div class="builder-add-row">
          <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-add-placeholder">+ Mitreisende:r ohne Konto</button>
        </div>
      </section>

      <section class="planning-section">
        <div class="planning-section-head"><h2 class="planning-section-title">Einladungslinks</h2></div>
        <p class="text-muted small">Wer den Link öffnet, kann sich einloggen oder ein Konto erstellen und wird automatisch zur Reise hinzugefügt.</p>
        <div id="invites-list"></div>
        <div class="builder-add-row">
          <button type="button" class="btn btn-sm btn-primary" id="btn-create-invite">+ Einladungslink erstellen</button>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/ui-feedback.js"></script>
  <script src="/src/reisen-client.js"></script>
  <script src="/src/reisen-members.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="/src/site-header.js"></script>
  <script src="/src/site-nav.js"></script>
</body>
</html>
