<style>
/* Layout: full-bleed 3D stage, one quiet info card bottom-left, a found-list on the right. Single deliberate dark look (FPL navy). */
:root {
  --navy: #0b1730; --navy-2: #13254a; --ink: #eef3ff; --dim: #93a5c6;
  --orange: #ffa53a; --teal: #3ee6c1; --card: rgba(11, 23, 48, 0.82); --line: rgba(147, 165, 198, 0.22);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--ink); font-family: var(--f-display);
  background: radial-gradient(120% 90% at 50% 35%, var(--navy-2) 0%, var(--navy) 60%, #070f22 100%);
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }
.hud { position: fixed; pointer-events: none; display: flex; flex-direction: column; gap: 10px; }
.hud > * { pointer-events: auto; }
#info {
  left: max(16px, calc(env(safe-area-inset-left, 0px) + 16px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(340px, calc(100vw - 32px));
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; backdrop-filter: blur(8px); }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
h1 { margin: 6px 0 4px; font-weight: 900; font-size: 26px; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; color: var(--dim); font-size: 14px; line-height: 1.45; }
.count { font: 500 13px/1 var(--f-mono); color: var(--ink); margin-top: 10px; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--orange); transition: width .4s; }
#detail[hidden] { display: none !important; }
#detail h2 { margin: 4px 0 4px; font-size: 18px; font-weight: 700; }
#list {
  right: max(16px, calc(env(safe-area-inset-right, 0px) + 16px)); top: calc(env(safe-area-inset-top, 0px) + 16px);
  width: 210px; max-height: calc(100% - 32px);
}
#list ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
#list li { display: flex; gap: 8px; align-items: center; color: var(--dim); }
#list li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); flex: none; }
#list li.found { color: var(--ink); }
#list li.found::before { background: var(--orange); border-color: var(--orange); }
.btns { display: flex; gap: 8px; margin-top: 10px; }
button {
  font: 700 12px/1 var(--f-display); color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 12px; cursor: pointer;
}
button:hover { border-color: var(--orange); color: var(--orange); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.back { position: fixed; z-index: 5; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); color: var(--ink); text-decoration: none; font: 700 12px/1 var(--f-display); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; backdrop-filter: blur(8px); }
.back:hover { border-color: var(--orange); color: var(--orange); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 500 13px var(--f-mono); color: var(--dim); }
#detail { position: relative; padding-right: 44px; }
.x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; font-size: 20px; line-height: 1; border-radius: 50%; }
@media (max-width: 640px) {
  #info.has-detail .card:not(#detail) { display: none; }
  #list { display: none; }
  h1 { font-size: 22px; }
}
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// wait briefly for the sign font so canvas textures use it
await Promise.race([Promise.all([document.fonts.load('900 64px "Archivo"'), document.fonts.load('700 32px "Archivo"')]), new Promise(r => setTimeout(r, 2500))]).catch(() => {});

const COL = {
  orange: 0xffa53a, orange2: 0xf07c22, orangeDeep: 0xd85f1c, cream: 0xf4e7cf, navy: 0x0b1730,
  asphalt: 0x1d2840, walk: 0x8c97ad, curb: 0xb7c0d2, concrete: 0xc6ccd8, darkSteel: 0x2a3550,
  glassWarm: 0xffd58a, glassTeal: 0x3ee6c1, glassBlue: 0x7fb8ff, wood: 0xc68a55, green: 0x5fbf7a,
  greenDark: 0x3b8f5c, white: 0xf7f9ff, black: 0x111522, tram: 0x2d6fe0, red: 0xe5534b, brick: 0xc8643f
};

// ---------- renderer / scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 1, 400);
const HOME = new THREE.Vector3(40, 31, 40);
camera.position.copy(HOME);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.5, 5, -1.5);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 25; controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x1a2440, 1.1));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(30, 50, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 120 });
sun.shadow.bias = -0.0005;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6fa8ff, 0.8);
rim.position.set(-30, 20, -25);
scene.add(rim);

// ---------- helpers ----------
const mats = new Map();
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  if (!mats.has(key)) mats.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.05, flatShading: true, ...opts }));
  return mats.get(key);
}
const glow = (color, i = 1) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: i, roughness: 0.4 });
function mesh(geo, m, parent, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, typeof m === 'number' ? mat(m) : m);
  o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true;
  (parent || scene).add(o); return o;
}
// box placed by its bottom-center
const box = (w, h, d, m, p, x = 0, y = 0, z = 0) => mesh(new THREE.BoxGeometry(w, h, d), m, p, x, y + h / 2, z);
const cyl = (rt, rb, h, m, p, x = 0, y = 0, z = 0, seg = 12) => mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m, p, x, y + h / 2, z);
const sph = (r, m, p, x = 0, y = 0, z = 0) => mesh(new THREE.SphereGeometry(r, 14, 10), m, p, x, y, z);
const grp = (p, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); (p || scene).add(g); return g; };

function signTex(lines, { bg = '#ffa53a', fg = '#0b1730', w = 512, h = 160, size = 64, weight = 900, font = 'Archivo', border } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  if (border) { g.strokeStyle = border; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10); }
  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  const arr = [].concat(lines);
  arr.forEach((l, i) => {
    const s = i === 0 ? size : size * 0.55;
    g.font = `${i === 0 ? weight : 700} ${s}px "${font}", Arial, sans-serif`;
    const y = h / 2 + (i - (arr.length - 1) / 2) * size * 0.85;
    g.fillText(l, w / 2, y);
  });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}
function sign(lines, w, h, opts, parent, x, y, z, ry = 0, emissive = 0.35) {
  const ratio = w / h;
  const tex = signTex(lines, { w: 512, h: Math.round(512 / ratio), ...opts });
  const m = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: emissive, roughness: .6 });
  const s = mesh(new THREE.BoxGeometry(w, h, 0.08), [mat(COL.darkSteel), mat(COL.darkSteel), mat(COL.darkSteel), mat(COL.darkSteel), m, mat(COL.darkSteel)], parent, x, y, z);
  s.rotation.y = ry; return s;
}

// clickable details
const DETAILS = [];
function tag(obj, title, text) { obj.userData.label = { title, text }; DETAILS.push(obj); return obj; }

// people
const SHIRTS = [COL.orange, COL.glassTeal, COL.white, COL.tram, 0x9b7bff, COL.red, COL.cream];
const SKIN = [0xf2c9a0, 0xd9a072, 0x8d5a3b, 0xf6d8bd];
const people = [];
function person(p, x, z, { y = 0, shirt, helmet = false, laptop = false, ry = 0, sit = false } = {}) {
  const g = grp(p, x, y, z); g.rotation.y = ry;
  const s = shirt ?? SHIRTS[(people.length * 3) % SHIRTS.length];
  if (!sit) { cyl(0.09, 0.09, 0.45, COL.darkSteel, g, -0.1, 0, 0, 6); cyl(0.09, 0.09, 0.45, COL.darkSteel, g, 0.1, 0, 0, 6); }
  cyl(0.2, 0.24, 0.5, s, g, 0, sit ? 0.05 : 0.42, 0, 8);
  sph(0.17, SKIN[people.length % SKIN.length], g, 0, sit ? 0.75 : 1.12, 0);
  if (helmet) {
    mesh(new THREE.SphereGeometry(0.2, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), COL.orange, g, 0, sit ? 0.8 : 1.17, 0);
    cyl(0.27, 0.27, 0.03, COL.orange, g, 0, sit ? 0.79 : 1.16, 0.03);
  }
  if (laptop) { box(0.36, 0.02, 0.26, COL.concrete, g, 0, sit ? 0.5 : 0.7, 0.3); const sc = box(0.36, 0.24, 0.02, glow(COL.glassTeal, .8), g, 0, sit ? 0.52 : 0.72, 0.43); sc.rotation.x = -0.25; }
  g.userData.phase = Math.random() * 6.28;
  people.push(g); return g;
}
function tree(p, x, z, s = 1) {
  const g = grp(p, x, 0, z);
  cyl(0.1 * s, 0.14 * s, 1.0 * s, COL.wood, g, 0, 0, 0, 6);
  mesh(new THREE.IcosahedronGeometry(0.75 * s, 0), COL.green, g, 0, 1.4 * s, 0);
  mesh(new THREE.IcosahedronGeometry(0.5 * s, 0), COL.greenDark, g, 0.3 * s, 1.95 * s, 0.1);
  return g;
}
function plant(p, x, y, z) { cyl(0.16, 0.12, 0.25, COL.brick, p, x, y, z, 8); mesh(new THREE.IcosahedronGeometry(0.22, 0), COL.green, p, x, y + 0.4, z); }
function windowRow(p, face, count, width, y, h, m, offset = 0, depth = 0) {
  // face: 'z' -> on +z plane at depth, 'x' -> on +x plane
  const step = width / count;
  for (let i = 0; i < count; i++) {
    const c = -width / 2 + step * (i + 0.5) + offset;
    if (face === 'z') { box(step * 0.62, h, 0.06, m, p, c, y, depth); box(step * 0.72, 0.08, 0.2, COL.cream, p, c, y - 0.06, depth); }
    else { box(0.06, h, step * 0.62, m, p, depth, y, c); box(0.2, 0.08, step * 0.72, COL.cream, p, depth, y - 0.06, c); }
  }
}
const flicker = [];
function litWindow(color, i = 0.9) { const m = glow(color, i); flicker.push(m); return m; }

// ---------- ground plate ----------
box(28, 1.4, 28, 0x16203a, null, 0, -1.4, 0);
box(28.2, 0.12, 28.2, COL.orange, null, 0, -1.52, 0); // orange edge trim like a model base
box(26, 0.1, 26, COL.asphalt, null, 0, -0.1, 0);
// lot + sidewalk (lot occupies x,z in [-13,4])
box(17.6, 0.3, 17.6, COL.walk, null, -4.6, 0, -4.6);
box(17.6, 0.32, 0.25, COL.curb, null, -4.6, 0, 4.1);
box(0.25, 0.32, 17.6, COL.curb, null, 4.1, 0, -4.6);
// road markings
for (let z = -12; z < 12; z += 2.2) box(0.18, 0.02, 1.1, COL.white, null, 8.5, 0, z);
for (let x = -12; x < 3; x += 2.2) box(1.1, 0.02, 0.18, COL.white, null, x, 0, 8.5);
for (let i = 0; i < 6; i++) box(0.5, 0.02, 2.4, COL.white, null, 5 + i * 0.9 + 0.2, 0, 5.7); // crosswalk
// tram rails on x road
for (const dx of [-0.45, 0.45]) box(0.08, 0.04, 26, 0x6b7790, null, 10.4 + dx, 0, 0);

const L0 = 0.3; // lot surface height

// ---------- main FPL house ----------
const H = 2.5; // floor height
const main = grp(null, -3.2, L0, -3.2);
// ground floor: café
box(7, H, 7, COL.cream, main, 0, 0, 0);
for (const [face, d] of [['z', 3.52], ['x', 3.52]]) windowRow(main, face, 3, 6, 0.5, 1.6, litWindow(COL.glassWarm, .8), 0, d);
box(6.4, 0.05, 1.4, COL.orange, main, 0, 2.15, 4.2).rotation.x = 0.25; // awning
box(1.4, 0.05, 6.4, COL.orange2, main, 4.2, 2.15, 0).rotation.z = -0.25;
for (let i = 0; i < 7; i++) box(0.4, 0.06, 1.42, i % 2 ? COL.white : COL.orange, main, -2.85 + i * 0.95, 2.18, 4.2).rotation.x = 0.25;
const cafe = sign(['FPL CAFÉ', 'Stammtisch · Do 18:00'], 4.2, 0.9, {}, main, 0, 2.75, 3.56);
tag(cafe, 'Stammtisch im FPL-Café', 'Jeden Donnerstag: Bier, Mate und die Frage, warum Pläne immer noch als PDF verschickt werden.');
// café tables outside
for (const [tx, tz] of [[-2, 5.2], [0.4, 5.3], [2.4, 5.1]]) {
  cyl(0.4, 0.4, 0.05, COL.white, main, tx, 0.7, tz); cyl(0.05, 0.05, 0.7, COL.darkSteel, main, tx, 0, tz, 6);
  cyl(0.06, 0.06, 0.18, COL.white, main, tx + 0.15, 0.75, tz, 8);
}
const stamm = grp(main, 0, 0, 0);
person(stamm, -2.6, 5.2, { ry: Math.PI / 2, sit: true, laptop: true, y: 0.25 });
person(stamm, -1.4, 5.3, { ry: -Math.PI / 2, sit: true, y: 0.25 });
person(stamm, 0.4, 6.0, { ry: Math.PI, sit: true, y: 0.25, shirt: COL.glassTeal });
person(stamm, 2.9, 5.4, { ry: -Math.PI / 2, sit: true, y: 0.25, laptop: true });
tag(stamm, 'Studis mit Laptops', 'Hier entsteht gerade ein Startup. Oder eine Projektarbeit. Oder beides, je nach Kaffeestand.');

// floor 1: drawing studio (orange)
const f1 = grp(main, 0, H, 0);
box(7, H, 7, COL.orange, f1, 0, 0, 0);
windowRow(f1, 'z', 3, 6, 0.45, 1.5, litWindow(COL.glassWarm, .6), 0, 3.52);
windowRow(f1, 'x', 3, 6, 0.45, 1.5, litWindow(COL.glassWarm, .6), 0, 3.52);
// balcony with drafting table
box(3.4, 0.15, 1.3, COL.concrete, f1, -1.4, 0, 4.15);
for (let i = 0; i < 7; i++) box(0.05, 0.75, 0.05, COL.darkSteel, f1, -3 + i * 0.53, 0.15, 4.75);
box(3.4, 0.05, 0.06, COL.darkSteel, f1, -1.4, 0.9, 4.75);
const draft = grp(f1, -1.6, 0.15, 4.1);
cyl(0.04, 0.04, 0.8, COL.darkSteel, draft, 0, 0, 0, 6);
const board = box(1.0, 0.04, 0.7, COL.white, draft, 0, 0.8, 0); board.rotation.x = -0.5;
box(0.6, 0.01, 0.02, COL.tram, draft, 0, 0.86, 0); // blueprint line
person(draft, 0.9, 0.0, { ry: -Math.PI / 2 });
plant(f1, -2.8, 0.15, 4.4);
tag(draft, 'Reissbrett auf dem Balkon', 'Analog geplant, digital gedacht: die letzte Handskizze vor dem BIM-Modell.');

// floor 2: AI lab
const f2 = grp(main, 0, H * 2, 0);
box(7, H, 7, COL.concrete, f2, 0, 0, 0);
windowRow(f2, 'z', 4, 6, 0.4, 1.6, litWindow(COL.glassTeal, 1.0), 0, 3.52);
windowRow(f2, 'x', 4, 6, 0.4, 1.6, litWindow(COL.glassTeal, 1.0), 0, 3.52);
const ai = sign(['AI LAB'], 1.0, 2.0, { bg: '#0b1730', fg: '#3ee6c1', size: 110 }, f2, 3.8, 0.4, 2.2, Math.PI / 2, 0.9);
ai.rotation.z = 0; ai.scale.set(1, 1, 1);
tag(ai, 'AI Lab', 'Im zweiten Stock rechnet eine KI Varianten durch. Sie weiss noch nicht, was eine Brandschutzwand ist.');
// cornice
box(7.6, 0.35, 7.6, COL.orangeDeep, main, 0, H * 3, 0);

// roof
const roof = grp(main, 0, H * 3 + 0.35, 0);
box(7.2, 0.4, 0.15, COL.orangeDeep, roof, 0, 0, 3.55); box(0.15, 0.4, 7.2, COL.orangeDeep, roof, 3.55, 0, 0);
box(7.2, 0.4, 0.15, COL.orangeDeep, roof, 0, 0, -3.55); box(0.15, 0.4, 7.2, COL.orangeDeep, roof, -3.55, 0, 0);
// giant hard hat mascot
const hat = grp(roof, 0.2, 0, 0.2); hat.scale.setScalar(1.12);
const hatTop = grp(hat, 0, 0, 0);
mesh(new THREE.SphereGeometry(1.9, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(COL.orange, { roughness: .45 }), hatTop, 0, 0.55, 0);
cyl(2.55, 2.55, 0.18, mat(COL.orange, { roughness: .45 }), hatTop, 0.2, 0.45, 0.2, 24);
const ridge = mesh(new THREE.TorusGeometry(1.75, 0.16, 6, 24, Math.PI), COL.orange2, hatTop, 0, 0.55, 0); ridge.rotation.y = Math.PI / 2;
for (const ex of [-0.6, 0.6]) {
  const e = sph(0.3, COL.white, hatTop, ex * 0.72, 1.25, 1.66); e.scale.set(1, 1.2, 0.6);
  sph(0.15, COL.black, hatTop, ex * 0.72 + 0.04, 1.25, 1.84);
}
const smile = mesh(new THREE.TorusGeometry(0.32, 0.06, 6, 12, Math.PI), COL.black, hatTop, 0.0, 0.95, 1.86); smile.rotation.z = Math.PI; smile.rotation.x = -0.15;
for (const ex of [-0.75, 0.75]) { const ch = sph(0.15, COL.red, hatTop, ex, 0.9, 1.78); ch.scale.set(1, 0.6, 0.4); }
sign(['FPL'], 1.0, 0.45, { bg: '#0b1730', fg: '#ffa53a', size: 120 }, hatTop, 0, 1.9, 1.05, 0, 0.5).rotation.x = -0.65;
hatTop.rotation.y = Math.PI / 4;

const cargo = grp(null, 6.4, 0, -6);
for (const wz of [-0.7, 0.6]) { const w = mesh(new THREE.TorusGeometry(0.28, 0.05, 6, 16), COL.black, cargo, 0, 0.3, wz); w.rotation.y = Math.PI / 2; }
box(0.7, 0.5, 0.7, COL.orange, cargo, 0, 0.4, -0.55);
box(0.06, 0.06, 1.3, COL.glassTeal, cargo, 0, 0.6, 0);
person(cargo, 0, 0.35, { y: 0.15, shirt: COL.cream, helmet: true });
tag(cargo, 'Lastenvelo mit Plänen', 'Liefert Pläne aus. Auf Papier. Aus Nostalgie.');
// more pedestrians on sidewalks
person(null, -2.5, 3.6, { y: L0, shirt: COL.red, ry: 0.4 });
person(null, -3.1, 3.7, { y: L0, shirt: COL.orange, ry: -0.6, laptop: true });
person(null, 3.6, -8.8, { y: L0, helmet: true, shirt: COL.glassTeal, ry: -Math.PI / 2 });
person(null, -12.4, -0.5, { y: L0, shirt: COL.white, ry: Math.PI / 2 });
// recycling skip with old components
const skip = grp(null, 3.0, L0, -0.4);
box(1.3, 0.6, 0.8, COL.green, skip, 0, 0, 0);
for (let i = 0; i < 4; i++) { const pc = box(0.5, 0.12, 0.2, [COL.brick, COL.wood, COL.concrete, COL.glassBlue][i], skip, -0.3 + i * 0.2, 0.62 + (i % 2) * 0.1, 0); pc.rotation.y = i * 0.7; }
tag(skip, 'Bauteilbörse', 'Hier landet nichts im Abfall: Ziegel, Fenster und Balken warten auf ihr zweites Leben.');

// fog of dots: floating "data" particles over the block
const pts = new THREE.BufferGeometry();
const pArr = new Float32Array(240 * 3);
for (let i = 0; i < 240; i++) { pArr[i * 3] = (Math.random() - 0.5) * 30; pArr[i * 3 + 1] = Math.random() * 24 + 2; pArr[i * 3 + 2] = (Math.random() - 0.5) * 30; }
pts.setAttribute('position', new THREE.BufferAttribute(pArr, 3));
const particles = new THREE.Points(pts, new THREE.PointsMaterial({ color: COL.orange, size: 0.12, transparent: true, opacity: 0.55 }));
scene.add(particles);

// ---------- UI: found list ----------
const found = new Set();
const itemsEl = document.getElementById('items');
DETAILS.forEach((d, i) => { const li = document.createElement('li'); li.textContent = d.userData.label.title; li.id = 'it' + i; itemsEl.appendChild(li); d.userData.idx = i; });
function updateCount() {
  document.getElementById('count').textContent = `${found.size} / ${DETAILS.length} entdeckt`;
  document.getElementById('bar').style.width = (found.size / DETAILS.length * 100) + '%';
}
updateCount();
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.label) o = o.parent;
    if (o) { show(o); return; }
  }
  hideDetail(); // Tipp ins Leere schliesst den Textblock
});
function hideDetail() {
  document.getElementById('detail').hidden = true;
  document.getElementById('info').classList.remove('has-detail');
}
document.getElementById('d-close').addEventListener('click', hideDetail);
addEventListener('keydown', e => { if (e.key === 'Escape') hideDetail(); });
function show(o) {
  const { title, text } = o.userData.label;
  const isNew = !found.has(o.userData.idx);
  found.add(o.userData.idx);
  document.getElementById('it' + o.userData.idx).classList.add('found');
  document.getElementById('d-kind').textContent = isNew ? `Neu entdeckt · ${found.size} von ${DETAILS.length}` : 'Schon entdeckt';
  document.getElementById('d-title').textContent = title;
  document.getElementById('d-text').textContent = text;
  document.getElementById('detail').hidden = false;
  document.getElementById('info').classList.add('has-detail');
  updateCount();
  // Ausgangsgrösse merken, damit schnelles Mehrfachklicken das Objekt nicht aufbläst
  if (bump) bump.o.scale.copy(bump.s);
  if (!o.userData.baseScale) o.userData.baseScale = o.scale.clone();
  o.scale.copy(o.userData.baseScale);
  bump = { o, t: 0, s: o.userData.baseScale };
}
let bump = null;
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.textContent = controls.autoRotate ? 'Drehung pausieren' : 'Drehung starten';
  spinBtn.setAttribute('aria-pressed', controls.autoRotate);
});
document.getElementById('reset').addEventListener('click', () => { camera.position.copy(HOME); controls.target.set(-1.5, 5, -1.5); controls.update(); });
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { controls.autoRotate = false; spinBtn.textContent = 'Drehung starten'; spinBtn.setAttribute('aria-pressed', false); }
renderer.domElement.addEventListener('pointerdown', () => { if (controls.autoRotate) spinBtn.click(); }, { once: true });

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); fitCamera(); });
function fitCamera() { // pull back on tall/narrow screens so the block fits
  const k = Math.max(1, 1.5 / camera.aspect);
  HOME.set(40, 31, 40).multiplyScalar(Math.min(k, 2.2));
}
fitCamera(); camera.position.copy(HOME);

// ---------- animation ----------
const clock = new THREE.Clock();
window.__setTime = null; // hook for offline rendering
function animate(t) {
  jib.rotation.y = Math.sin(t * 0.18) * 0.9 + 0.6;
  trolley.position.x = 6 + Math.sin(t * 0.35) * 2.5;
  const drop = 5 + Math.sin(t * 0.5) * 1.5;
  load.position.y = -drop; cable.scale.y = drop; cable.position.y = -drop;
  drone.position.set(Math.cos(t * 0.3) * 10, 15 + Math.sin(t * 1.3) * 0.4, Math.sin(t * 0.3) * 10);
  drone.rotation.y = -t * 0.3;
  rotors.forEach((r, i) => r.rotation.y = t * 30 + i);
  const tz = Math.sin(t * 0.22) * 8.5; tram.position.z = tz;
  const dz = -4 + Math.sin(t * 0.4) * 5; dog.position.z = dz;
  dog.rotation.y = Math.cos(t * 0.4) > 0 ? Math.PI / 2 : -Math.PI / 2;
  legs.forEach((l, i) => l.rotation.z = Math.sin(t * 9 + (i % 2) * Math.PI) * 0.4);
  const pr = (t * 0.12) % 1;
  printed.scale.y = Math.max(0.02, pr); printed.position.y = 0.1 + pr * 0.5;
  gantry.position.y = 0.2 + pr * 1.0 + 0.3;
  gantry.position.z = Math.sin(t * 3) * 0.35; nozzle.position.x = Math.cos(t * 3.3) * 0.35;
  hatTop.position.y = Math.abs(Math.sin(t * 1.6)) * 0.25;
  hatTop.rotation.z = Math.sin(t * 1.6) * 0.04;
  rArm1.rotation.z = Math.sin(t * 0.9) * 0.6; rArm2.rotation.z = -0.9 + Math.sin(t * 0.9 + 1) * 0.5;
  robot.rotation.y = Math.sin(t * 0.45) * 1.2;
  boom.rotation.z = 0.3 + Math.sin(t * 0.8) * 0.25; stick.rotation.z = -0.4 + Math.sin(t * 0.8 + 1.2) * 0.35;
  excTop.rotation.y = Math.PI + Math.sin(t * 0.3) * 0.5;
  scanHead.rotation.y = t * 4;
  beacon.material.emissiveIntensity = (Math.sin(t * 4) > 0.3) ? 3 : 0.2;
  people.forEach(p => { p.position.y += 0; p.children.forEach(() => {}); p.rotation.z = Math.sin(t * 2 + p.userData.phase) * 0.03; });
  walkers[0].position.x = 3.0 - ((t * 0.5) % 14); walkers[0].rotation.y = -Math.PI / 2;
  walkers[1].position.z = 3.2 - Math.abs(Math.sin(t * 0.15)) * 0.2;
  flicker.forEach((m, i) => m.emissiveIntensity = 0.7 + 0.2 * Math.sin(t * 0.7 + i * 1.7));
  particles.rotation.y = t * 0.02;
  if (bump) { bump.t += 0.05; const k = 1 + Math.sin(Math.min(bump.t, 1) * Math.PI) * 0.12; bump.o.scale.copy(bump.s).multiplyScalar(k); if (bump.t >= 1) { bump.o.scale.copy(bump.s); bump = null; } }
}
function loop() {
  const t = window.__setTime ?? clock.getElapsedTime();
  animate(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
document.getElementById('loading').remove();
loop();
window.__fpl = { scene, camera, controls, renderer, animate };
</script>

</body></html>
