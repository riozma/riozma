<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="/src/site-init.js"></script>
  <title>Canvas – Manuel Rio Zeltner</title>
  <link rel="icon" href="/src/img/favicon.svg">
  <meta name="description" content="Der gemeinsame Canvas von riozma.ch – zeichne, stempel und schreib mit allen anderen Besuchern.">
  <meta name="theme-color" content="#2c3a2b">
  <link rel="stylesheet" href="/src/canvas.css">
</head>
<body class="canvas-body">
  <canvas id="cv-main"></canvas>
  <iframe id="cv-page-ghost" class="cv-page-ghost" src="/?embed=1" tabindex="-1" aria-hidden="true" title="Seiteninhalt (Vorschau)"></iframe>
  <canvas id="cv-overlay"></canvas>
  <div class="cv-zoom" id="cv-zoom" role="group" aria-label="Zoom">
    <button type="button" id="cv-zoom-out" aria-label="Verkleinern">−</button>
    <button type="button" id="cv-zoom-reset" aria-label="Zoom zurücksetzen">100%</button>
    <button type="button" id="cv-zoom-in" aria-label="Vergrössern">+</button>
  </div>
  <div class="cv-scrollbar" id="cv-scrollbar" aria-hidden="true"><i></i></div>
  <input type="text" id="cv-text-input" class="cv-text-input d-none" maxlength="80" autocomplete="off" placeholder="Text …">

  <a href="/" class="cv-home" aria-label="Zur Startseite">← riozma</a>

  <div class="cv-palette dock-bottom" id="cv-palette" data-tool="hand">
    <div class="cv-top">
      <div class="cv-handle" id="cv-handle" title="Verschieben" aria-label="Palette verschieben">
        <span></span><span></span><span></span>
      </div>
            <div class="cv-section cv-actions">
        <button type="button" id="cv-undo" title="Letztes eigenes Element entfernen">↶<small>Zurück</small></button>
        <button type="button" id="cv-ghost-toggle" class="active" title="Seiteninhalt als Schatten anzeigen">◫<small>Inhalt</small></button>
        <button type="button" id="cv-reset" hidden title="Ganzen Canvas für alle zurücksetzen">⟲<small>Reset</small></button>
      </div>
      <button type="button" class="cv-collapse" id="cv-collapse" aria-label="Palette ein-/ausklappen" aria-expanded="true">▾</button>
    </div>
    <div class="cv-section cv-tools" id="cv-tools" role="toolbar" aria-label="Werkzeuge">
      <button type="button" data-tool="hand" class="active" title="Verschieben (oder Mausrad / zwei Finger)">✋<small>Hand</small></button>
      <button type="button" data-tool="pen" title="Stift">✎<small>Stift</small></button>
      <button type="button" data-tool="erase" title="Radierer">⌫<small>Gummi</small></button>
      <button type="button" data-tool="shape" title="Formen">◆<small>Form</small></button>
      <button type="button" data-tool="stamp" title="Stempel">✿<small>Stempel</small></button>
      <button type="button" data-tool="text" title="Text">T<small>Text</small></button>
    </div>
    <div class="cv-section cv-colors" id="cv-colors" aria-label="Farbe"></div>
    <div class="cv-section cv-sizes" id="cv-sizes" aria-label="Grösse">
      <button type="button" data-size="0" title="Klein"><i style="--d:6px"></i></button>
      <button type="button" data-size="1" class="active" title="Mittel"><i style="--d:12px"></i></button>
      <button type="button" data-size="2" title="Gross"><i style="--d:20px"></i></button>
    </div>
    <div class="cv-section cv-sub" id="cv-sub-shape" hidden>
      <button type="button" data-shape="rect" class="active" title="Rechteck">▭</button>
      <button type="button" data-shape="circle" title="Kreis">◯</button>
      <button type="button" data-shape="tri" title="Dreieck">△</button>
      <button type="button" data-shape="line" title="Linie">╱</button>
      <button type="button" id="cv-fill" title="Gefüllt / Umriss" aria-pressed="true">Füllung</button>
    </div>
    <div class="cv-section cv-sub cv-stamps" id="cv-sub-stamp" hidden></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/supabase-config.js"></script>
  <script src="/src/supabase-client.js"></script>
  <script src="/src/canvas-core.js"></script>
  <script src="/src/canvas-page.js"></script>
</body>
</html>
